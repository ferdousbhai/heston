<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- A red hot chili whose body traces the volatility skew: steep through the downside strikes,
       troughing near the money, its tip lifting through the upside wing. Everything but the faint
       axis sits inside the maskable safe circle, so launchers that crop to a circle keep the pepper. -->
  <defs>
    <linearGradient id="flesh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset=".5" stop-color="#ee2c3c"/>
      <stop offset="1" stop-color="#b8102f"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd66a"/>
      <stop offset="1" stop-color="#2f8f3f"/>
    </linearGradient>
    <radialGradient id="ember" cx=".72" cy=".18" r=".65">
      <stop offset="0" stop-color="#3a2017"/>
      <stop offset="1" stop-color="#08090c"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#ember)"/>
  <!-- Strike axis, faint: enough to read as a chart at card size, gone at favicon size. -->
  <path d="M96 412h320" stroke="#ffffff" stroke-opacity=".14" stroke-width="10" stroke-linecap="round"/>
  <path d="M102 150C98 118 128 102 162 104c30 2 48 14 52 34 12 76 34 146 86 166 42 16 84-10 112-62 6-10 16-6 13 5-18 86-68 148-140 148-86 0-150-88-183-245z"
        fill="url(#flesh)"/>
  <!-- Gloss along the shoulder and belly. -->
  <path d="M138 158c14 86 50 158 110 190" fill="none" stroke="#ffffff" stroke-opacity=".32"
        stroke-width="16" stroke-linecap="round"/>
  <!-- Calyx and stem. -->
  <path d="M100 146c10-30 40-40 62-30 22-12 52-4 56 26-18-8-34-6-48 4-18-12-44-12-70 0z" fill="url(#stem)"/>
  <path d="M162 118c-2-30 12-54 40-66" fill="none" stroke="url(#stem)" stroke-width="18" stroke-linecap="round"/>
</svg>
